# Loon 3.5.3 (1014)；待设备验证，不保证零泄露。
[General]
# 全局 DNS 为三家并发查询，不区分国内外；请在 App 关闭普通 DNS 回落。
ip-mode = v4-only
ipv6-vif = always
doh-server = https://dns.alidns.com/dns-query,https://cloudflare-dns.com/dns-query,https://dns.google/dns-query
hijack-dns = *:53
allow-wifi-access = false
mitm-on-wifi-access = false
disable-stun = true
udp-fallback-mode = REJECT
sni-sniffing = true
interface-mode = auto
test-timeout = 5
proxy-test-url = https://www.google.com/generate_204
internet-test-url = https://www.baidu.com
geoip-url = https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

[Proxy]
# 节点仅本机填写，勿公开凭证；添加后加入下方“代理”。

[Remote Proxy]
# 订阅地址可能含 token，仅本机填写。

[Remote Filter]
# 节点筛选，按需添加。

[Proxy Group]
# 本机添加节点后加入此组并选中；默认拒绝，避免误直连。
代理 = select,REJECT

[Rule]
# 本地规则；GEOIP 与远程国内 IP 任一命中可直连，并非双重验证。
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,代理

[Remote Rule]
# 远程规则，更新周期在 App 设置。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Global/Global.list,policy=代理,tag=国外网站,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/China/China_Domain.list,policy=DIRECT,tag=国内域名,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaIPs/ChinaIPs.list,policy=DIRECT,tag=国内IP,enabled=true

[Host]
# 按需添加域名映射，默认留空。

[Script]
# 默认不启用脚本。

[Remote Script]
# 默认不加载远程脚本。

[Plugin]
# 默认不加载插件。

[MITM]
# 不配置解密域名或证书；证书私钥勿公开。
skip-server-cert-verify = false


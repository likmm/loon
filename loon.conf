# Loon 3.5.3 (1014)；待设备验证，不保证零泄露。
[General]
# 全局 DNS 为三家并发查询，不区分国内外；请在 App 关闭普通 DNS 回落。
ip-mode = v4-only
ipv6-vif = always
doh-server = https://dns.alidns.com/dns-query,https://cloudflare-dns.com/dns-query,https://dns.google/dns-query
hijack-dns = *:53
allow-wifi-access = false
mitm-on-wifi-access = false
disable-stun = true
udp-fallback-mode = REJECT
sni-sniffing = true
interface-mode = auto
test-timeout = 5
proxy-test-url = https://www.google.com/generate_204
internet-test-url = https://www.baidu.com
geoip-url = https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

[Proxy]
# 节点仅本机填写，勿公开凭证；添加后自动参与“全球代理”组测速。

[Remote Proxy]
# 订阅地址可能含 token，仅本机填写。

[Remote Filter]
# 自动纳入本地与订阅节点；排除常见通知及回国节点名称，仍需自行审查订阅。
全部节点 = NameRegex,FilterKey="^(?!.*(回国|剩余|到期|流量|官网|订阅|套餐|重置)).+"

[Proxy Group]
国内直连 = select,DIRECT
# 每 600 秒测速自动选节点；不设 DIRECT 回退。
全球代理 = url-test,全部节点,url=https://www.google.com/generate_204,interval=600,tolerance=100

[Rule]
# 本地规则；GEOIP 与远程国内 IP 任一命中可直连，并非双重验证。
DOMAIN,localhost,国内直连
DOMAIN-SUFFIX,local,国内直连
IP-CIDR,127.0.0.0/8,国内直连,no-resolve
IP-CIDR,10.0.0.0/8,国内直连,no-resolve
IP-CIDR,172.16.0.0/12,国内直连,no-resolve
IP-CIDR,192.168.0.0/16,国内直连,no-resolve
IP-CIDR,169.254.0.0/16,国内直连,no-resolve
IP-CIDR,223.5.5.5/32,国内直连,no-resolve
GEOIP,CN,国内直连
FINAL,全球代理

[Remote Rule]
# 顺序：国内域名、国内IP、苹果（含 iCloud）、微软、谷歌。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/China/China_Domain.list,policy=国内直连,tag=国内域名,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaIPs/ChinaIPs.list,policy=国内直连,tag=国内IP,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple.list,policy=国内直连,tag=苹果服务,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Microsoft/Microsoft.list,policy=国内直连,tag=微软服务,enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Google/Google.list,policy=全球代理,tag=谷歌服务,enabled=true

[Host]
# 按需添加域名映射，默认留空。

[Script]
# 默认不启用脚本。

[Remote Script]
# 默认不加载远程脚本。

[Plugin]
# 默认不加载插件。

[MITM]
# 不配置解密域名或证书；证书私钥勿公开。
skip-server-cert-verify = false




